<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="-60 -45 940 260">
  <defs><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d1f4d"/><stop offset="1" stop-color="#4c2a85"/></linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.12" stop-color="#fff"/><stop offset="0.88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.4338461538461538" stop-color="#fff"/><stop offset="0.5661538461538462" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mx"><rect x="-60" y="-45" width="940.0" height="260.0" fill="url(#fx)"/></mask>
<mask id="my"><rect x="-60" y="-45" width="940.0" height="260.0" fill="url(#fy)"/></mask>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1f4d"/>
      <stop offset="100%" stop-color="#4c2a85"/>
    </linearGradient>
    <style>
      .q    { font: italic 500 21px Georgia, 'Times New Roman', serif; fill: #ffffff; }
      .q2   { font: italic 700 23px Georgia, 'Times New Roman', serif; fill: #fb7185; }
      .by   { font: 500 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c4b5fd; letter-spacing: 1px; }
      .mark { font: 700 90px Georgia, serif; fill: #f43f5e; opacity: 0.55; }
      .fade { opacity: 0; animation: f 1.2s ease-out forwards; }
      .d2 { animation-delay: 0.8s; } .d3 { animation-delay: 1.6s; }
      @keyframes f { to { opacity: 1; } }
