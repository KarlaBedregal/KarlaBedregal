  </defs><g mask="url(#my)"><rect x="-60" y="-45" width="940.0" height="260.0" fill="url(#fbg)" mask="url(#mx)"/></g>
  
  <text x="30" y="88" class="mark">“</text>
  <text x="410" y="62" text-anchor="middle" class="q fade">You wanna know how I did it? This is how I did it, Anton:</text>
  <text x="410" y="100" text-anchor="middle" class="q2 fade d2">I never saved anything for the swim back.</text>
  <text x="410" y="140" text-anchor="middle" class="by fade d3">— VINCENT FREEMAN, GATTACA (1997)</text>
</svg>
