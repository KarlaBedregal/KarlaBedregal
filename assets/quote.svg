<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1f4d"/>
      <stop offset="100%" stop-color="#4c2a85"/>
    </linearGradient>
    <style>
      .q    { font: italic 500 21px Georgia, 'Times New Roman', serif; fill: #ffffff; }
      .q2   { font: italic 700 23px Georgia, 'Times New Roman', serif; fill: #fb7185; }
      .by   { font: 500 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c4b5fd; letter-spacing: 1px; }
      .mark { font: 700 90px Georgia, serif; fill: #f43f5e; opacity: 0.55; }
      .fade { opacity: 0; animation: f 1.2s ease-out forwards; }
      .d2 { animation-delay: 0.8s; } .d3 { animation-delay: 1.6s; }
      @keyframes f { to { opacity: 1; } }
    </style>
  </defs>
  <rect x="1.5" y="1.5" width="817" height="167" rx="14" fill="url(#bg)" stroke="#f43f5e" stroke-width="3"/>
  <text x="30" y="88" class="mark">“</text>
  <text x="410" y="62" text-anchor="middle" class="q fade">You wanna know how I did it? This is how I did it, Anton:</text>
  <text x="410" y="100" text-anchor="middle" class="q2 fade d2">I never saved anything for the swim back.</text>
  <text x="410" y="140" text-anchor="middle" class="by fade d3">— VINCENT FREEMAN, GATTACA (1997)</text>
</svg>
