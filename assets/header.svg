<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font: 700 50px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .sub   { font: 500 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ede9fe; letter-spacing: 0.5px; }
      .fade  { opacity: 0; animation: fadeIn 1.2s ease-out forwards; }
      .d2    { animation-delay: 0.5s; }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 8s ease-in-out infinite reverse; }
      .wave1 { animation: drift 10s ease-in-out infinite alternate; }
      .wave2 { animation: drift 14s ease-in-out infinite alternate-reverse; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>

  <rect width="1000" height="230" fill="url(#bg)"/>

  <!-- decorative circles -->
  <g class="float1" fill="#ffffff" opacity="0.10">
    <circle cx="90" cy="50" r="38"/>
    <circle cx="880" cy="60" r="22"/>
  </g>
  <g class="float2" fill="#ffffff" opacity="0.08">
    <circle cx="930" cy="140" r="48"/>
    <circle cx="170" cy="150" r="16"/>
  </g>

  <!-- little circuit lines -->
  <g stroke="#ede9fe" stroke-width="2" fill="none" opacity="0.25">
    <path d="M30 120 H90 V95 H130"/>
    <circle cx="134" cy="95" r="4" fill="#ede9fe"/>
    <path d="M970 30 H900 V55 H860"/>
    <circle cx="856" cy="55" r="4" fill="#ede9fe"/>
  </g>

  <text x="500" y="100" text-anchor="middle" class="title fade">Hi, I'm Karla 👋</text>
  <text x="500" y="140" text-anchor="middle" class="sub fade d2">Systems Engineering student  ·  Applied AI  ·  Robotics &amp; VR in progress</text>

  <!-- waves -->
  <g class="wave2">
    <path d="M0 200 C 150 170, 300 230, 500 200 S 850 170, 1060 200 V230 H0 Z" fill="#c4b5fd" opacity="0.35"/>
  </g>
  <g class="wave1">
    <path d="M0 212 C 180 190, 320 235, 520 212 S 860 192, 1060 214 V230 H0 Z" fill="#ede9fe" opacity="0.45"/>
  </g>
</svg>
