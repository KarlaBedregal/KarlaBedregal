<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <style>
      .wave { animation: drift 12s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <g class="wave">
    <path d="M0 40 C 180 10, 330 70, 520 40 S 860 10, 1060 40 V110 H0 Z" fill="#c4b5fd" opacity="0.5"/>
  </g>
  <path d="M0 55 C 170 30, 340 85, 520 58 S 850 30, 1000 55 V110 H0 Z" fill="url(#bg)"/>
</svg>
