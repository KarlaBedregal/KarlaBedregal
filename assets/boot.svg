<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <defs>
    <style>
      .win  { fill: #1e1433; }
      .bar  { fill: #2d1f4d; }
      .t    { font: 15px 'Fira Code', 'Consolas', 'Courier New', monospace; fill: #ede9fe; white-space: pre; }
      .p    { fill: #c4b5fd; }
      .ok   { fill: #4ade80; font-weight: 700; }
      .wait { fill: #fbbf24; font-weight: 700; }
      .dim  { fill: #a78bfa; }
      .hi   { fill: #f0abfc; font-weight: 700; }
      .ln   { opacity: 0; animation: show 0.35s ease-out forwards; }
      .l1 { animation-delay: 0.3s; }  .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.6s; }  .l4 { animation-delay: 2.2s; }
      .l5 { animation-delay: 2.8s; }  .l6 { animation-delay: 3.4s; }
      .l7 { animation-delay: 4.0s; }  .l8 { animation-delay: 4.6s; }
      .l9 { animation-delay: 5.4s; }
      .cursor { animation: blink 1s step-end infinite; fill: #c4b5fd; }
      @keyframes show  { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect class="win" x="0" y="0" width="820" height="330" rx="14"/>
  <path class="bar" d="M0 14 A14 14 0 0 1 14 0 H806 A14 14 0 0 1 820 14 V38 H0 Z"/>
  <circle cx="24" cy="19" r="6" fill="#f87171"/>
  <circle cx="44" cy="19" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="19" r="6" fill="#4ade80"/>
  <text x="410" y="24" text-anchor="middle" class="t dim" style="font-size:13px">karla@unsa: ~/robot</text>

  <text x="24" y="72"  class="t ln l1"><tspan class="p">karla@unsa</tspan>:~/robot$ ./boot.sh</text>
  <text x="24" y="102" class="t ln l2">[ <tspan class="ok">OK</tspan> ] Loading Systems Engineering core .......... <tspan class="dim">3rd year</tspan></text>
  <text x="24" y="130" class="t ln l3">[ <tspan class="ok">OK</tspan> ] Mounting /ai  <tspan class="dim">(vision · machine learning · RL)</tspan></text>
  <text x="24" y="158" class="t ln l4">[ <tspan class="ok">OK</tspan> ] Starting optimization &amp; simulation daemon</text>
  <text x="24" y="186" class="t ln l5">[ <tspan class="ok">OK</tspan> ] Linking web, APIs &amp; DevOps modules</text>
  <text x="24" y="214" class="t ln l6">[ <tspan class="wait">..</tspan> ] Compiling vr-module <tspan class="dim">(blender, unity)</tspan> ........ 60%</text>
  <text x="24" y="242" class="t ln l7">[ <tspan class="wait">..</tspan> ] Installing ros2 + gazebo .................. 30%</text>
  <text x="24" y="276" class="t ln l8"><tspan class="hi">&gt;&gt; System ready. Target: robots that leave the lab 🤖</tspan></text>
  <text x="24" y="306" class="t ln l9"><tspan class="p">karla@unsa</tspan>:~/robot$ <tspan class="cursor">█</tspan></text>
</svg>
