<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="-60 -60 940 450">
  <defs><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1433"/><stop offset="1" stop-color="#2d1f4d"/></linearGradient>
<linearGradient id="fx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.12" stop-color="#fff"/><stop offset="0.88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.25066666666666665" stop-color="#fff"/><stop offset="0.7493333333333334" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="mx"><rect x="-60" y="-60" width="940.0" height="450.0" fill="url(#fx)"/></mask>
<mask id="my"><rect x="-60" y="-60" width="940.0" height="450.0" fill="url(#fy)"/></mask>
    <style>
      .win  { fill: #1e1433; }
      .bar  { fill: #2d1f4d; }
      .t    { font: 15px 'Fira Code', 'Consolas', 'Courier New', monospace; fill: #ede9fe; white-space: pre; }
      .p    { fill: #fb7185; font-weight: 700; }
      .ok   { fill: #4ade80; font-weight: 700; }
      .wait { fill: #fbbf24; font-weight: 700; }
      .dim  { fill: #a78bfa; }
      .hi   { fill: #fb7185; font-weight: 700; }
      .ln   { opacity: 0; animation: show 0.35s ease-out forwards; }
      .l1 { animation-delay: 0.3s; }  .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.6s; }  .l4 { animation-delay: 2.2s; }
      .l5 { animation-delay: 2.8s; }  .l6 { animation-delay: 3.4s; }
      .l7 { animation-delay: 4.0s; }  .l8 { animation-delay: 4.6s; }
      .l9 { animation-delay: 5.4s; }
      .cursor { animation: blink 1s step-end infinite; fill: #c4b5fd; }
      @keyframes show  { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs><g mask="url(#my)"><rect x="-60" y="-60" width="940.0" height="450.0" fill="url(#fbg)" mask="url(#mx)"/></g>

  
  
  <circle cx="24" cy="19" r="6" fill="#f87171"/>
  <circle cx="44" cy="19" r="6" fill="#fbbf24"/>
